<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Sahara Hospitality Suite</title>
  <desc id="desc">Animated banner: a sunrise over drifting dunes, the Sahara wordmark, and a typed list of connected hotel departments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a31"/>
      <stop offset="1" stop-color="#1b2743"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c766"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9a441" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="420" rx="24"/></clipPath>
    <clipPath id="tile"><rect x="0" y="14" width="180" height="180" rx="42"/></clipPath>
    <clipPath id="type"><rect x="286" y="240" width="640" height="38"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#glow)"/>

    <!-- drifting dunes -->
    <path fill="#2563eb" fill-opacity="0.28" d="M-600 386 Q-450 344 -300 386 T0 386 T300 386 T600 386 T900 386 T1200 386 T1500 386 L1500 420 L-600 420 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="26s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#gold)" fill-opacity="0.9" d="M-600 396 Q-450 362 -300 396 T0 396 T300 396 T600 396 T900 396 T1200 396 T1500 396 L1500 420 L-600 420 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- sunrise mark -->
  <g transform="translate(72 96)">
    <circle cx="90" cy="104" r="118" fill="url(#sunglow)">
      <animate attributeName="r" values="108;128;108" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(0 6)">
      <rect x="0" y="14" width="180" height="180" rx="42" fill="#0d1428"/>
      <g clip-path="url(#tile)">
        <g stroke="url(#gold)" stroke-width="12" stroke-linecap="round">
          <line x1="90" y1="52" x2="90" y2="74">
            <animate attributeName="y2" values="74;66;74" dur="4.5s" repeatCount="indefinite"/>
          </line>
          <line x1="54" y1="68" x2="42" y2="84">
            <animate attributeName="y2" values="84;76;84" dur="4.5s" begin="0.4s" repeatCount="indefinite"/>
          </line>
          <line x1="126" y1="68" x2="138" y2="84">
            <animate attributeName="y2" values="84;76;84" dur="4.5s" begin="0.8s" repeatCount="indefinite"/>
          </line>
        </g>
        <path d="M32 150 A58 58 0 0 1 148 150 Z" fill="url(#gold)"/>
        <g fill="#0d1428">
          <rect x="77" y="110" width="12" height="12" rx="1.5"/>
          <rect x="91" y="110" width="12" height="12" rx="1.5"/>
          <rect x="77" y="124" width="12" height="12" rx="1.5"/>
          <rect x="91" y="124" width="12" height="12" rx="1.5"/>
        </g>
        <path fill="url(#gold)" d="M0 164 C 40 140 70 176 104 164 C 138 152 160 168 180 158 L180 194 L0 194 Z"/>
        <path fill="#f0c766" fill-opacity="0.9" d="M0 178 C 44 162 76 190 112 178 C 146 167 166 180 180 172 L180 194 L0 194 Z"/>
      </g>
      <rect x="0" y="14" width="180" height="180" rx="42" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="292" y="152" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="86" font-weight="800" fill="#ffffff" letter-spacing="-2">Sahara</text>
  <text x="296" y="192" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="600" fill="#7fa9ff" letter-spacing="10">HOSPITALITY SUITE</text>

  <!-- typed tagline -->
  <text x="292" y="268" clip-path="url(#type)" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="23" fill="#c9d4ea">reservations &#183; housekeeping &#183; folio &#183; audit</text>
  <rect class="caret" x="900" y="248" width="4" height="26" rx="2" fill="#d9a441"/>

  <text x="292" y="316" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" fill="#8b9ab8">One system for every hotel in your group.</text>

  <style>
    .caret { animation: blink 1s steps(1) infinite, trace 8s steps(44) infinite; }
    #type rect { transform-box: fill-box; transform-origin: left center; animation: type 8s steps(44) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes type { 0% { transform: scaleX(0); } 62%, 100% { transform: scaleX(1); } }
    @keyframes trace { 0% { transform: translateX(-608px); } 62%, 100% { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .caret, #type rect { animation: none; }
    }
  </style>
</svg>
