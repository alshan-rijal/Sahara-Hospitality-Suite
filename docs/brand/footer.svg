<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="ftitle">
  <title id="ftitle">Built by Alshan Rijal</title>
  <defs>
    <linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fsweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0c766" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0c766" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f0c766" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" rx="20" fill="#0b1020"/>
  <rect y="0" width="1200" height="150" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <line x1="60" y1="40" x2="1140" y2="40" stroke="url(#fline)" stroke-width="2"/>

  <text x="600" y="82" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Built by Alshan Rijal</text>
  <text x="600" y="114" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="16" fill="#9fb0d0">alshanrijal.com.np &#183; contact@alshanrijal.com.np</text>

  <rect class="sweep" x="0" y="36" width="200" height="8" fill="url(#fsweep)" opacity="0.8"/>
  <style>
    .sweep { animation: sweep 6s linear infinite; }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .sweep { animation: none; } }
  </style>
</svg>
